name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [main, master, ci/linux-appimage]

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build environment (Ubuntu 22.04, clang 21, Python 3.12)
        run: docker build -t za-linux-build -f tools/linux/Containerfile tools/linux

      - name: Build AppImage and Portable Zip
        run: |
          docker run --rm -v "$PWD:/src" -w /src za-linux-build bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends dotnet-sdk-8.0 python3-venv zip
            git config --global --add safe.directory /src
            DEB=0 PYTHON=python3.12 tools/za/dist-linux.sh
            { find build/linux/x86_64/za-AppDir -type f \( -name "*.so*" -o -perm -u+x \) -exec objdump -T {} + 2>/dev/null || true; } |
                grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1'

      - uses: actions/upload-artifact@v4
        with:
          name: ZA-Recomp-linux-x86_64
          path: |
            build/dist/*.AppImage
            build/dist/*.zip
          if-no-files-found: error
